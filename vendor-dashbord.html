<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#0066ff;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#0066ff;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
</style>

</head>

<body>

<header>
<h1>Shop Owner Dashboard</h1>
</header>

<div class="container">

<div class="card">
<h3>➕ Add Product</h3>
<button>Add Product</button>
</div>

<div class="card">
<h3>📦 My Products</h3>
<button>View Products</button>
</div>

<div class="card">
<h3>🛒 Orders</h3>
<button>View Orders</button>
</div>

<div class="card">
<h3>💰 Earnings</h3>
<button>View Earnings</button>
</div>

</div>

</body>
</html>
